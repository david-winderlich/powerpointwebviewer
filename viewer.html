<!DOCTYPE html>
<!-- Based on "Live Website Viewer for PowerPoint" by Pedro Hernandez (PeopleWorks Services), MIT License. Modified. -->
<html>
<head>
  <title>Website Viewer</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* ─── Rahmen, Glasfläche und Blätterpfeile ────────────────────────
       PowerPoint zeigt Add-ins immer undurchsichtig und eckig an. Deshalb liegt
       das Add-in über der ganzen Folie und zeichnet Rand und Glasfläche selbst.
       Alle Maße beziehen sich auf eine Folie von 960 × 540 pt.
       --rand und --rand-ersatz werden per Skript aus rand/farben.js gesetzt. */
    :root {
      --rand: none;                 /* Randtextur: url(rand/<farbe>.png) */
      --rand-ersatz: #3f8f6b;       /* Farbe, solange das Bild fehlt */
      /* Blätterpfeile im farbigen Rand unten links und unten rechts, Angaben in pt.
         Der Rand ist 9 pt breit; die Pfeile müssen hineinpassen. */
      --nav-breite: 14;             /* Breite eines Pfeils */
      --nav-hoehe: 7;               /* Höhe eines Pfeils */
      --nav-seite: 2;               /* Abstand zum linken bzw. rechten Folienrand */
      --nav-unten: 1;               /* Abstand zum unteren Folienrand */
    }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      width: 100%; height: 100vh; font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--rand) center / 100% 100% no-repeat var(--rand-ersatz);
    }

    /* Control bar */
    #config {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #config.hidden {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    #config .icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    #urlInput {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }

    #urlInput:focus {
      border-color: #4a90d9;
    }

    #urlInput::placeholder {
      color: #aaa;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: #4a90d9;
      color: white;
    }
    .btn-primary:hover { background: #3a7bc8; }

    .btn-window {
      background: #27ae60;
      color: white;
      padding: 8px 12px;
    }
    .btn-window:hover { background: #219a52; }

    .btn-hide {
      background: #e8e8e8;
      color: #555;
      padding: 8px 10px;
    }
    .btn-hide:hover { background: #ddd; }

    .btn-icon {
      background: #e8e8e8;
      color: #555;
      padding: 8px 11px;
      font-size: 15px;
      line-height: 1;
    }
    .btn-icon:hover { background: #ddd; }

    /* Toggle button (when controls are hidden) */
    #toggleBtn {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 101;
      /* 24px hit area, but only a 10px circle is drawn (background-clip) */
      width: 24px;
      height: 24px;
      padding: 7px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.9);
      background-clip: content-box;
      color: #555;
      cursor: pointer;
      font-size: 9px;
      line-height: 1;
      opacity: 0;               /* invisible until the mouse is over it */
      display: none;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    #toggleBtn:hover { opacity: 1; }
    #toggleBtn.visible { display: flex; }

    /* Environment badge */
    #envBadge {
      display: none;
      position: absolute;
      top: 58px;
      right: 12px;
      z-index: 100;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: opacity 0.3s ease;
    }
    #envBadge.online {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
    }
    #envBadge.desktop {
      background: #d4edda;
      color: #155724;
      border: 1px solid #28a745;
    }
    #envBadge.hidden { opacity: 0; pointer-events: none; }

    /* Ganzes Add-in-Fenster (auch für den Vollbildmodus, daher eigener Hintergrund) */
    #appWrapper {
      position: fixed;
      inset: 0;
      background: var(--rand) center / 100% 100% no-repeat var(--rand-ersatz);
    }

    /* Milchglasfläche mit abgerundeten Ecken, darin der iframe */
    #glas {
      position: absolute;
      left: calc(9/960*100vw);
      top: calc(9/540*100vh);
      width: calc(942/960*100vw);
      height: calc(522/540*100vh);
      border-radius: calc(13/960*100vw);
      overflow: hidden;
      /* clip-path rundet auch iframe und WebGL-Inhalte zuverlässig ab (Safari/WebKit) */
      clip-path: inset(0 round calc(13/960*100vw));
      background: rgba(255,255,255,.92);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    /* Option „Ohne Rahmen“: bisheriges Verhalten, Inhalt füllt das ganze Fenster */
    body.ohne-rahmen,
    body.ohne-rahmen #appWrapper { background: #f0f2f5; }
    body.ohne-rahmen #glas {
      left: 0; top: 0; width: 100%; height: 100%;
      border-radius: 0;
      clip-path: none;
      background: #f0f2f5;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    body.ohne-rahmen #webFrame { background: white; }
    body.ohne-rahmen #overlay { background: #f0f2f5; }

    /* iframe: randlos, füllt #glas, transparent (die Glasfläche scheint durch) */
    #webFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* Blätterpfeile: ‹ unten links, › unten rechts, im farbigen Rand außerhalb
       von #glas. Unsichtbar, bis die Maus in die Nähe kommt (Klasse .nah). */
    .nav-btn {
      position: absolute;
      bottom: calc(var(--nav-unten)/540*100vh);
      width: calc(var(--nav-breite)/960*100vw);
      height: calc(var(--nav-hoehe)/540*100vh);
      padding: 0;
      border: none;
      border-radius: calc(var(--nav-hoehe)/540*100vh);
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
      color: #334;
      line-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 90;
    }
    /* Pfeil als Grafik: passt unabhängig von der Schrift immer ins Kästchen */
    .nav-btn svg { display: block; height: 72%; width: auto; }
    #navPrev { left: calc(var(--nav-seite)/960*100vw); }
    #navNext { right: calc(var(--nav-seite)/960*100vw); }

    /* Tastentest: zeigt an, welche Tasten wo ankommen (Fehlersuche) */
    #tastenTest {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      min-width: 320px;
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(20, 24, 32, 0.88);
      color: #e8ecf2;
      font: 12px/1.5 Menlo, Consolas, monospace;
      white-space: pre;
      pointer-events: none;
      z-index: 99;
    }
    #tastenTest[hidden] { display: none; }
    .chk { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #555; white-space: nowrap; cursor: pointer; }
    .nav-btn.nah { opacity: 0.8; }
    .nav-btn:hover, .nav-btn:focus-visible { opacity: 1; background: #fff; }

    /* Kurze Meldung, z. B. wenn das Blättern nicht möglich ist */
    #navHinweis {
      position: absolute;
      left: 50%;
      bottom: calc(14/960*100vw);
      transform: translateX(-50%);
      max-width: 80%;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(30, 34, 44, 0.85);
      color: #fff;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 95;
    }
    #navHinweis.zeigen { opacity: 1; }

    /* Auswahlfeld Farbe in der Steuerleiste */
    .select {
      padding: 7px 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 13px;
      background: white;
      color: #333;
      cursor: pointer;
      outline: none;
    }
    .select:focus { border-color: #4a90d9; }

    /* Error / status overlay */
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      z-index: 50;
      text-align: center;
      padding: 2em;
    }

    #overlay.hidden { display: none; }

    #overlay .emoji { font-size: 48px; margin-bottom: 16px; }
    #overlay h2 { color: #333; font-size: 20px; margin-bottom: 8px; }
    #overlay p { color: #777; font-size: 14px; max-width: 460px; line-height: 1.5; }
    #overlay .overlay-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 24px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #overlay .overlay-btn:hover { background: #219a52; }
    #overlay .overlay-btn.secondary {
      background: #4a90d9;
      margin-left: 8px;
    }
    #overlay .overlay-btn.secondary:hover { background: #3a7bc8; }
    #overlay .tip {
      margin-top: 20px;
      padding: 12px 20px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      color: #856404;
      font-size: 12px;
      max-width: 460px;
    }

    /* Loading spinner */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 60;
      display: none;
      text-align: center;
    }
    #loading.active { display: block; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    #loading .loading-text {
      font-size: 12px;
      color: #999;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- Liste der Rahmenfarben (rand/farben.js) -->
  <script src="rand/farben.js"></script>
</head>
<body>
<div id="appWrapper">
<div id="glas">

  <!-- Control bar -->
  <div id="config">
    <span class="icon">🌐</span>
    <input id="urlInput" type="text" placeholder="Enter website URL (e.g. https://example.com)" />
    <select id="farbeSelect" class="select" title="Rahmenfarbe"></select>
    <label class="chk" title="Zeigt an, welche Tasten ankommen (zur Fehlersuche)"><input type="checkbox" id="tastenTestCheck"> Tastentest</label>
    <button class="btn btn-primary" onclick="loadUrl()">Load</button>
    <button class="btn btn-icon" onclick="reloadFrame()" title="Reload page">↻</button>
    <button class="btn btn-icon" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    <button id="btnOpenWindow" class="btn btn-window" onclick="openInDialog()" title="Seite im Browser öffnen">Im Browser öffnen</button>
    <button class="btn btn-hide" onclick="toggleControls()" title="Hide controls">✕</button>
  </div>

  <!-- Show controls button -->
  <button id="toggleBtn" onclick="toggleControls()" title="Show controls">⚙</button>

  <!-- Environment badge -->
  <div id="envBadge"></div>

  <!-- Welcome overlay -->
  <div id="overlay">
    <div class="emoji">🌐</div>
    <h2>Live Website Viewer</h2>
    <p>Enter a website URL above and click <strong>Load</strong> to display it inside this slide.</p>
    <p style="margin-top: 8px; font-size: 13px; color: #999;">💡 Tip: paste a YouTube or Vimeo link to embed a video.</p>
    <div style="margin-top: 24px; opacity: 0.5; font-size: 12px; color: #999;">
      Created by <strong>Pedro Hernandez</strong> &mdash; PeopleWorks Services
    </div>
  </div>

  <!-- Loading indicator -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading website...</div>
  </div>

  <!-- Website frame -->
  <iframe id="webFrame" src=""
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write; accelerometer; gyroscope; web-share"
          allowfullscreen
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation allow-presentation allow-downloads allow-modals"
          allowtransparency="true"></iframe>

  <!-- Hinweis beim Blättern -->
  <div id="navHinweis" role="status"></div>
  <div id="tastenTest" hidden></div>

</div><!-- /glas -->

  <!-- Blätterpfeile im farbigen Rand (außerhalb der Glasfläche) -->
  <button id="navPrev" class="nav-btn" type="button" title="Vorherige Folie" aria-label="Vorherige Folie"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M6.4 1.8 L3.2 5 L6.4 8.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="navNext" class="nav-btn" type="button" title="Nächste Folie" aria-label="Nächste Folie"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3.6 1.8 L6.8 5 L3.6 8.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

</div><!-- /appWrapper -->

  <script>
    const urlInput = document.getElementById('urlInput');
    const webFrame = document.getElementById('webFrame');
    const overlay = document.getElementById('overlay');
    const loading = document.getElementById('loading');
    const config = document.getElementById('config');
    const toggleBtn = document.getElementById('toggleBtn');
    const envBadge = document.getElementById('envBadge');
    const appWrapper = document.getElementById('appWrapper');

    let controlsVisible = true;
    let isOnline = false;        // true if running in PowerPoint Online
    let officeReady = false;
    let currentUrl = '';
    let loadTimeoutId = null;
    let iframeLoadFailed = false;

    // ─── Rahmenfarbe ──────────────────────────────────────
    // Die Farbliste steht in rand/farben.js. Jede Farbe braucht ein Bild rand/<id>.png.
    const farbeSelect = document.getElementById('farbeSelect');
    const STANDARD_FARBE = 'gruen';
    const OHNE_RAHMEN = 'ohne';
    const FARBEN = (Array.isArray(window.RAHMEN_FARBEN) && window.RAHMEN_FARBEN.length)
      ? window.RAHMEN_FARBEN
      : [{ id: 'gruen', name: 'Grün', ersatz: '#3f8f6b' }];   // falls farben.js fehlt
    let currentFarbe = STANDARD_FARBE;

    function findFarbe(id) {
      for (var i = 0; i < FARBEN.length; i++) if (FARBEN[i].id === id) return FARBEN[i];
      return null;
    }

    function fillFarbeSelect() {
      farbeSelect.innerHTML = '';
      FARBEN.forEach(function (f) {
        var o = document.createElement('option');
        o.value = f.id;
        o.textContent = f.name || f.id;
        farbeSelect.appendChild(o);
      });
      var o = document.createElement('option');
      o.value = OHNE_RAHMEN;
      o.textContent = 'Ohne Rahmen';
      farbeSelect.appendChild(o);
    }

    function applyFarbe(id) {
      if (id !== OHNE_RAHMEN && !findFarbe(id)) {
        id = findFarbe(STANDARD_FARBE) ? STANDARD_FARBE : FARBEN[0].id;
      }
      currentFarbe = id;
      farbeSelect.value = id;
      document.body.classList.toggle('ohne-rahmen', id === OHNE_RAHMEN);
      if (id !== OHNE_RAHMEN) {
        var f = findFarbe(id);
        var root = document.documentElement.style;
        root.setProperty('--rand', 'url("rand/' + encodeURIComponent(f.id) + '.png")');
        root.setProperty('--rand-ersatz', f.ersatz || '#3f8f6b');
      }
    }

    farbeSelect.addEventListener('change', function () {
      applyFarbe(farbeSelect.value);
      saveSetting('webViewerFarbe', currentFarbe);
    });

    // Startwert: Standard Grün. Zum Testen im Browser auch per ?farbe=orange.
    // In PowerPoint gilt danach die pro Folie gespeicherte Farbe (Office.onReady).
    fillFarbeSelect();
    applyFarbe(new URLSearchParams(location.search).get('farbe') || STANDARD_FARBE);

    // ─── Folien blättern ──────────────────────────────────
    // Pfeile ‹ › in den unteren Ecken und die Taste Page Down (weiter).
    // Pfeiltasten und Leertaste bleiben bewusst bei der Simulation.
    const navPrev = document.getElementById('navPrev');
    const navNext = document.getElementById('navNext');
    const navHinweis = document.getElementById('navHinweis');
    const NAV_NAEHE = 110 / 960;       // Einblend-Radius als Anteil der Fensterbreite
    let letztesBlaettern = 0;
    let hinweisTimer = null;

    function zeigeHinweis(text) {
      navHinweis.textContent = text;
      navHinweis.classList.add('zeigen');
      clearTimeout(hinweisTimer);
      hinweisTimer = setTimeout(function () { navHinweis.classList.remove('zeigen'); }, 3500);
    }

    // ─── Tastentest (Fehlersuche) ─────────────────────────
    // Zeigt die letzten Tastendrücke an: wo sie ankamen und was passiert ist.
    // Ein- und ausschalten in der Steuerleiste, gespeichert pro Folie.
    const tastenTest = document.getElementById('tastenTest');
    const tastenTestCheck = document.getElementById('tastenTestCheck');
    let tastenTestAn = false;
    const testZeilen = [];
    function testLog(text) {
      if (!tastenTestAn) return;
      var t = new Date();
      var zeit = ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
      testZeilen.push(zeit + '  ' + text);
      while (testZeilen.length > 8) testZeilen.shift();
      tastenTest.textContent = 'Tastentest\n' + testZeilen.join('\n');
    }
    function setTastenTest(an) {
      tastenTestAn = !!an;
      tastenTestCheck.checked = tastenTestAn;
      tastenTest.hidden = !tastenTestAn;
      if (tastenTestAn && !testZeilen.length) tastenTest.textContent = 'Tastentest\nWarte auf Tastendruck …';
    }
    function tasteBeschreiben(e) {
      var ziel = e.target && e.target.tagName ? e.target.tagName.toLowerCase() + (e.target.type ? '[' + e.target.type + ']' : '') : '?';
      return 'key=' + e.key + ' code=' + e.code + ' (' + e.keyCode + ') auf ' + ziel;
    }
    tastenTestCheck.addEventListener('change', function () {
      setTastenTest(tastenTestCheck.checked);
      saveSetting('webViewerTastenTest', tastenTestAn);
    });

    function blaettern(richtung) {
      var jetzt = Date.now();
      if (jetzt - letztesBlaettern < 400) return;     // gehaltene Taste nicht mehrfach auslösen
      letztesBlaettern = jetzt;
      try {
        if (!officeReady || !Office.context.document.goToByIdAsync) {
          zeigeHinweis('Blättern geht nur in PowerPoint.');
          testLog('→ ' + richtung + ': nicht in PowerPoint');
          return;
        }
        var ziel = richtung === 'zurueck' ? Office.Index.Previous : Office.Index.Next;
        Office.context.document.goToByIdAsync(ziel, Office.GoToType.Index, function (r) {
          if (r.status === Office.AsyncResultStatus.Failed) {
            var msg = r.error && r.error.message ? r.error.message : 'unbekannter Fehler';
            zeigeHinweis('Blättern nicht möglich: ' + msg);
            testLog('→ ' + richtung + ': Fehler ' + msg);
          } else {
            testLog('→ ' + richtung + ': PowerPoint meldet Erfolg');
          }
        });
      } catch (e) {
        zeigeHinweis('Blättern nicht möglich: ' + e.message);
        testLog('→ ' + richtung + ': Ausnahme ' + e.message);
      }
    }

    navPrev.addEventListener('click', function () { blaettern('zurueck'); });
    navNext.addEventListener('click', function () { blaettern('weiter'); });

    // Pfeile einblenden, wenn die Maus in der Nähe ist (x/y in Koordinaten des Add-ins)
    function naehePruefen(x, y) {
      var radius = NAV_NAEHE * window.innerWidth;
      [navPrev, navNext].forEach(function (b) {
        var r = b.getBoundingClientRect();
        var dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
        b.classList.toggle('nah', dx * dx + dy * dy < radius * radius);
      });
    }
    function naeheAus() { navPrev.classList.remove('nah'); navNext.classList.remove('nah'); }
    let letzteMaus = { t: 0, x: 0, y: 0 };   // letzte Mausbewegung direkt im Add-in
    document.addEventListener('mousemove', function (e) {
      letzteMaus = { t: Date.now(), x: e.clientX, y: e.clientY };
      naehePruefen(e.clientX, e.clientY);
    });
    document.documentElement.addEventListener('mouseleave', naeheAus);

    // Page Down im Add-in selbst (wenn das Add-in den Fokus hat)
    // Nur echte Texteingaben (z. B. das URL-Feld) ausnehmen, nicht Checkboxen oder Auswahlfelder
    const TEXT_TYPEN = /^(text|search|email|number|password|tel|url|date|datetime-local|month|time|week)$/i;
    function istEingabe(el) {
      if (!el) return false;
      if (el.isContentEditable || el.tagName === 'TEXTAREA') return true;
      return el.tagName === 'INPUT' && TEXT_TYPEN.test(el.type || 'text');
    }
    // Page Down erkennen, auch wenn ein Gerät nur code oder keyCode richtig setzt
    function istPageDown(e) {
      return e.key === 'PageDown' || e.code === 'PageDown' || e.keyCode === 34;
    }
    document.addEventListener('keydown', function (e) {
      testLog('Add-in:     ' + tasteBeschreiben(e));
      if (!istPageDown(e) || istEingabe(e.target)) return;
      e.preventDefault();
      if (!e.repeat) blaettern('weiter');
    }, true);

    // Nachrichten von navigation.js aus der geladenen Seite (nur aus dem eigenen iframe)
    window.addEventListener('message', function (e) {
      if (e.source !== webFrame.contentWindow) return;
      var d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.typ === 'folie' && (d.richtung === 'weiter' || d.richtung === 'zurueck')) {
        blaettern(d.richtung);
      } else if (d.typ === 'maus' && typeof d.x === 'number' && typeof d.y === 'number') {
        // Mausposition aus der Seite in Add-in-Koordinaten umrechnen (iframe ist skaliert)
        var r = webFrame.getBoundingClientRect();
        var s = d.breite ? r.width / d.breite : 1;
        naehePruefen(r.left + d.x * s, r.top + d.y * s);
      } else if (d.typ === 'maus-weg') {
        // Die Meldung kommt verzögert an. Ist die Maus inzwischen im Add-in
        // (z. B. auf dem Rand), gilt deren Position.
        if (Date.now() - letzteMaus.t < 300) naehePruefen(letzteMaus.x, letzteMaus.y);
        else naeheAus();
      }
    });

    // Seiten auf derselben Domain (david-winderlich.github.io): Der Viewer fängt
    // Page Down direkt in der Seite ab und bindet navigation.js nur noch für die
    // Mausposition ein. Seiten von anderen Domains können navigation.js selbst
    // einbinden; dann übernimmt das Skript auch Page Down.
    // NAV_VERSION bei Änderungen an navigation.js erhöhen, damit kein alter
    // Zwischenspeicher-Stand geladen wird.
    const NAV_VERSION = '3';
    const NAV_SKRIPT = new URL('navigation.js?v=' + NAV_VERSION, location.href).href;
    function navigationEinbinden() {
      var doc;
      try {
        doc = webFrame.contentDocument;
        if (!doc || !doc.documentElement) return;
      } catch (e) {
        testLog('Seite von anderer Domain: Page Down nur mit eigener navigation.js');
        return;   // andere Domain: kein Zugriff, dann nur Pfeile im Add-in
      }
      pageDownDirekt(doc);
      try {
        if (doc.getElementById('ppt-navigation')) return;
        doc.defaultView.__pptNavigationDirekt = true;   // navigation.js: Tasten nicht doppelt
        var s = doc.createElement('script');
        s.id = 'ppt-navigation';
        s.src = NAV_SKRIPT;
        (doc.head || doc.documentElement).appendChild(s);
      } catch (e) { /* ohne Skript fehlt nur das Einblenden über der Seite */ }
    }

    // Page Down direkt in der geladenen Seite abfangen (nur gleiche Domain)
    function pageDownDirekt(doc) {
      try {
        var win = doc.defaultView;
        if (win.__pptPageDownDirekt) return;
        win.__pptPageDownDirekt = true;
        win.addEventListener('keydown', function (e) {
          testLog('Simulation: ' + tasteBeschreiben(e));
          if (!istPageDown(e)) return;
          if (istEingabe(e.target) || istEingabe(doc.activeElement)) {
            testLog('            Textfeld hat den Fokus, nicht abgefangen');
            return;
          }
          e.preventDefault();
          e.stopPropagation();
          if (!e.repeat) blaettern('weiter');
        }, true);
        testLog('Page Down in der Seite aktiv');
      } catch (e) {
        testLog('Kein Zugriff auf die Seite: ' + e.message);
      }
    }

    // ─── Frame scaling ────────────────────────────────────
    // 1 = unchanged. Values above 1 give the embedded page a larger layout
    // area (like a bigger browser window); it is scaled back down to fit.
    const FRAME_SCALE = 1.5;
    function applyFrameScale() {
      webFrame.style.width = (FRAME_SCALE * 100) + '%';
      webFrame.style.height = (FRAME_SCALE * 100) + '%';
      webFrame.style.transformOrigin = '0 0';
      webFrame.style.transform = 'scale(' + (1 / FRAME_SCALE) + ')';
    }
    applyFrameScale();

    // ─── Detect environment ───────────────────────────────
    function detectEnvironment() {
      try {
        // Office.context.platform: 'OfficeOnline', 'PC', 'Mac', 'iOS', 'Android'
        const platform = Office.context.platform;
        if (platform === Office.PlatformType.OfficeOnline) {
          isOnline = true;
          envBadge.textContent = 'POWERPOINT ONLINE';
          envBadge.className = 'online';
        } else {
          isOnline = false;
          envBadge.textContent = 'DESKTOP';
          envBadge.className = 'desktop';
        }
      } catch (e) {
        // If Office API not available, assume standalone/testing
        envBadge.textContent = 'STANDALONE';
        envBadge.className = 'desktop';
      }
    }

    // ─── Normalize URL ────────────────────────────────────
    function normalizeUrl(url) {
      url = url.trim();
      if (!url) return '';
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      return url;
    }

    // ─── Validate URL ─────────────────────────────────────
    function isValidUrl(str) {
      try {
        new URL(str);
        return true;
      } catch {
        return false;
      }
    }

    // ─── Convert YouTube / Vimeo links to embeddable URLs ─
    // Regular video pages (youtube.com/watch, youtu.be, vimeo.com/ID)
    // block iframe embedding. Their /embed/ player URLs do not.
    function toEmbedUrl(url) {
      try {
        var u = new URL(url);
        var host = u.hostname.replace(/^www\./i, '').toLowerCase();

        // ─── YouTube ───
        if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'youtube-nocookie.com') {
          if (u.pathname.indexOf('/embed/') === 0) return url; // already embeddable
          var videoId = u.searchParams.get('v');
          var shortMatch = u.pathname.match(/^\/(?:shorts|live)\/([A-Za-z0-9_-]+)/);
          if (shortMatch) videoId = shortMatch[1];
          var listId = u.searchParams.get('list');
          var startAt = parseInt(u.searchParams.get('t') || u.searchParams.get('start'), 10);
          if (videoId) {
            var params = [];
            if (!isNaN(startAt) && startAt > 0) params.push('start=' + startAt);
            if (listId) params.push('list=' + listId);
            return 'https://www.youtube.com/embed/' + videoId +
                   (params.length ? '?' + params.join('&') : '');
          }
          if (listId && u.pathname.indexOf('/playlist') === 0) {
            return 'https://www.youtube.com/embed/videoseries?list=' + listId;
          }
          return url;
        }

        // ─── YouTube short links (youtu.be) ───
        if (host === 'youtu.be') {
          var id = u.pathname.split('/').filter(Boolean)[0];
          if (id) {
            var t = parseInt(u.searchParams.get('t'), 10);
            return 'https://www.youtube.com/embed/' + id +
                   (!isNaN(t) && t > 0 ? '?start=' + t : '');
          }
          return url;
        }

        // ─── Vimeo ───
        if (host === 'vimeo.com') {
          if (u.pathname.indexOf('/video/') !== -1) return url; // already embeddable
          var segments = u.pathname.split('/').filter(Boolean);
          for (var i = segments.length - 1; i >= 0; i--) {
            if (/^\d+$/.test(segments[i])) {
              return 'https://player.vimeo.com/video/' + segments[i];
            }
          }
        }
      } catch (e) {
        // Not a parseable URL — leave it unchanged
      }
      return url;
    }

    // ─── Show error in overlay ────────────────────────────
    function showError(title, message, showButtons) {
      overlay.classList.remove('hidden');
      let html = '<div class="emoji">⚠️</div>';
      html += '<h2>' + title + '</h2>';
      html += '<p>' + message + '</p>';

      if (showButtons && currentUrl) {
        html += '<div style="margin-top: 16px;">';
        html += '<button class="overlay-btn" onclick="openInDialog()">Im Browser öffnen</button>';
        html += '<button class="overlay-btn secondary" onclick="retryLoad()">Retry in Frame</button>';
        html += '</div>';
        if (isOnline) {
          html += '<div class="tip"><strong>Tip:</strong> In PowerPoint Online, many websites block being embedded in frames. Use <strong>"Im Browser öffnen"</strong> to view the site in a separate browser window.</div>';
        }
      }

      overlay.innerHTML = html;
      loading.classList.remove('active');
    }

    // ─── Show welcome screen ──────────────────────────────
    function showWelcome() {
      overlay.classList.remove('hidden');
      let html = '<div class="emoji">🌐</div>';
      html += '<h2>Live Website Viewer</h2>';
      html += '<p>Enter a website URL above and click <strong>Load</strong> to display it inside this slide.</p>';
      html += '<p style="margin-top: 8px; font-size: 13px; color: #999;">💡 Tip: paste a YouTube or Vimeo link to embed a video.</p>';

      if (isOnline) {
        html += '<div class="tip" style="margin-top: 16px;"><strong>PowerPoint Online detected:</strong> Some websites may not display inside the frame. If a site does not load, use the <strong>"Im Browser öffnen"</strong> button to open it in a separate browser window.</div>';
      }

      html += '<div style="margin-top: 24px; opacity: 0.5; font-size: 12px; color: #999;">';
      html += 'Created by <strong>Pedro Hernandez</strong> &mdash; PeopleWorks Services';
      html += '</div>';
      overlay.innerHTML = html;
    }

    // ─── Show / hide controls ─────────────────────────────
    function setControlsVisible(visible) {
      controlsVisible = visible;
      if (visible) {
        config.classList.remove('hidden');
        toggleBtn.classList.remove('visible');
        envBadge.classList.remove('hidden');
      } else {
        config.classList.add('hidden');
        toggleBtn.classList.add('visible');
        envBadge.classList.add('hidden');
      }
    }

    function toggleControls() {
      setControlsVisible(!controlsVisible);
    }

    // ─── Reload the current page ──────────────────────────
    function reloadFrame() {
      if (!currentUrl) {
        showWelcome();
        return;
      }
      overlay.classList.add('hidden');
      loading.classList.add('active');
      iframeLoadFailed = false;
      webFrame.src = currentUrl;
      startLoadTimeout();
    }

    // ─── Fullscreen toggle ────────────────────────────────
    function toggleFullscreen() {
      var fsElement = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsElement) {
        var exitFs = document.exitFullscreen || document.webkitExitFullscreen;
        if (exitFs) exitFs.call(document);
        return;
      }
      var requestFs = appWrapper.requestFullscreen || appWrapper.webkitRequestFullscreen;
      if (requestFs) {
        try {
          var result = requestFs.call(appWrapper);
          if (result && typeof result.catch === 'function') {
            // Fullscreen blocked (common inside Office) — fall back to a clean view
            result.catch(function () { setControlsVisible(false); });
          }
        } catch (e) {
          setControlsVisible(false);
        }
      } else {
        setControlsVisible(false);
      }
    }

    function onFullscreenChange() {
      var active = !!(document.fullscreenElement || document.webkitFullscreenElement);
      setControlsVisible(!active);
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);

    // ─── Open URL using Office Dialog API ─────────────────
    function openInDialog() {
      let url = currentUrl || normalizeUrl(urlInput.value);
      if (!url) {
        showError('Empty URL', 'Please enter a website URL first.', false);
        return;
      }

      // Try the default browser first
      try {
        var w = window.open(url, '_blank');
        if (w) return;
      } catch (e) {
        console.log('window.open failed:', e);
      }

      // Fallback: Office Dialog API
      try {
        if (officeReady && Office.context.ui) {
          Office.context.ui.displayDialogAsync(url, {
            width: 80,
            height: 80,
            promptBeforeOpen: false
          }, function (result) {
            if (result.status === Office.AsyncResultStatus.Failed) {
              // Fallback: open in new tab
              window.open(url, '_blank');
            }
          });
          return;
        }
      } catch (e) {
        console.log('Dialog API not available:', e);
      }

      // Fallback: open in new tab
      window.open(url, '_blank');
    }

    // ─── Retry loading in iframe ──────────────────────────
    function retryLoad() {
      if (currentUrl) {
        overlay.classList.add('hidden');
        loading.classList.add('active');
        iframeLoadFailed = false;
        webFrame.src = currentUrl;
        startLoadTimeout();
      }
    }

    // ─── Load timeout detection ───────────────────────────
    function startLoadTimeout() {
      clearTimeout(loadTimeoutId);
      iframeLoadFailed = false;

      loadTimeoutId = setTimeout(function () {
        // If loading indicator is still active after timeout, iframe probably failed
        if (loading.classList.contains('active')) {
          iframeLoadFailed = true;
          showError(
            'Website did not load',
            'The website is taking too long or may be blocking embedded display.' +
            (isOnline ? ' This is common in PowerPoint Online.' : ''),
            true
          );
        }
      }, isOnline ? 12000 : 15000); // Shorter timeout for Online since it's more likely to fail
    }

    // ─── Save settings (per add-in instance, i.e. per slide) ─
    function saveSetting(key, value) {
      try {
        if (officeReady && Office.context && Office.context.document && Office.context.document.settings) {
          Office.context.document.settings.set(key, value);
          Office.context.document.settings.saveAsync();
        }
      } catch (e) {
        // Silent: Office API not available (standalone/testing mode)
      }
    }

    // ─── Save URL to Office settings ──────────────────────
    function saveUrl(url) {
      saveSetting('webViewerUrl', url);
    }

    // ─── Load URL into iframe ─────────────────────────────
    function loadUrl() {
      let typedUrl = normalizeUrl(urlInput.value);

      if (!typedUrl) {
        showError('Empty URL', 'Please enter a website URL to load.', false);
        return;
      }

      if (!isValidUrl(typedUrl)) {
        showError('Invalid URL', 'The URL you entered is not valid. Please check it and try again.', false);
        return;
      }

      // Show the normalized URL the user typed
      urlInput.value = typedUrl;

      // Convert YouTube / Vimeo links to their embeddable player URL
      currentUrl = toEmbedUrl(typedUrl);

      overlay.classList.add('hidden');
      loading.classList.add('active');
      iframeLoadFailed = false;

      // Set iframe src
      webFrame.src = currentUrl;

      // Start load timeout detection
      startLoadTimeout();

      // Save the URL the user typed (re-converted when reloaded)
      saveUrl(typedUrl);
    }

    // ─── Handle iframe load events ────────────────────────
    webFrame.addEventListener('load', function () {
      clearTimeout(loadTimeoutId);
      loading.classList.remove('active');

      if (webFrame.src && webFrame.src !== 'about:blank' && webFrame.src !== '') {
        // Check if iframe actually loaded content (blank page detection)
        try {
          // Try to access iframe document - if blocked by CORS, it loaded something
          var doc = webFrame.contentDocument;
          if (doc && doc.body) {
            var bodyContent = doc.body.innerHTML;
            // If body is completely empty, the site might have blocked loading
            if (!bodyContent || bodyContent.trim() === '') {
              showError(
                'Website appears blank',
                'The website loaded but shows no content. It may be blocking embedded display.',
                true
              );
              return;
            }
          }
        } catch (e) {
          // CORS error = the site actually loaded (different origin)
          // This is the GOOD case - site loaded from a different domain
        }
        navigationEinbinden();
        overlay.classList.add('hidden');
      }
    });

    // ─── Handle iframe errors ─────────────────────────────
    webFrame.addEventListener('error', function () {
      clearTimeout(loadTimeoutId);
      loading.classList.remove('active');
      iframeLoadFailed = true;
      showError(
        'Could not load website',
        'This website may block being embedded in frames, or there may be a connection issue.',
        true
      );
    });

    // ─── Enter key to load ────────────────────────────────
    urlInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        loadUrl();
      }
    });

    // ─── Initialize with Office.js ────────────────────────
    if (typeof Office !== 'undefined' && Office.onReady) Office.onReady(function () {
      officeReady = true;

      // Detect environment
      detectEnvironment();

      // Update welcome screen with environment-specific tips
      if (!currentUrl) {
        showWelcome();
      }

      // Saved frame colour for this slide (default: Grün)
      try {
        var savedFarbe = Office.context.document.settings.get('webViewerFarbe');
        applyFarbe(savedFarbe || STANDARD_FARBE);
        setTastenTest(Office.context.document.settings.get('webViewerTastenTest') === true);
      } catch (e) {
        // Silent: Office API not available (standalone/testing mode)
      }

      // Try to load saved URL for this slide
      try {
        if (Office.context && Office.context.document && Office.context.document.settings) {
          var savedUrl = Office.context.document.settings.get('webViewerUrl');
          if (savedUrl) {
            urlInput.value = savedUrl;
            currentUrl = toEmbedUrl(savedUrl);
            overlay.classList.add('hidden');
            loading.classList.add('active');
            webFrame.src = currentUrl;
            startLoadTimeout();
          }
        }
      } catch (e) {
        // Silent: Office API not available (standalone/testing mode)
      }
    });
  </script>
</body>
